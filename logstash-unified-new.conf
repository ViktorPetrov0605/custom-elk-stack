input {
  udp {
    port => 2050
    type => "netflow"
    codec => netflow {
      versions => [5, 9]
    }
  }
  udp {
    port => 6343
    type => "sflow"
    codec => sflow { }
  }
}

filter {
  # Capture the packet source IP from Logstash (UDP sender)
  mutate {
    add_field => { "[@metadata][src_ip]" => "%{[host][ip]}" }
  }

  if [type] == "netflow" {
    # Try to get NetFlow exporter IP, fallback to packet source
    if [netflow][exporter][ipv4_address] {
      mutate {
        add_field => { "[device][name]" => "%{[netflow][exporter][ipv4_address]}" }
      }
    } else if [netflow][ipv4_src_addr] {
      mutate {
        add_field => { "[device][name]" => "%{[netflow][ipv4_src_addr]}" }
      }
    } else if [ipfix][exporter][ipv4_address] {
      mutate {
        add_field => { "[device][name]" => "%{[ipfix][exporter][ipv4_address]}" }
      }
    } else {
      # Fallback to packet source IP from metadata
      mutate {
        add_field => { "[device][name]" => "%{[@metadata][src_ip]}" }
      }
    }
    mutate {
      add_field => { "flow_source" => "netflow" }
    }

    # ECS Field Mappings for NetFlow
    # Map source/destination IPs
    if [netflow][ipv4_src_addr] {
      mutate {
        add_field => { "[source][ip]" => "%{[netflow][ipv4_src_addr]}" }
      }
    }
    if [netflow][ipv4_dst_addr] {
      mutate {
        add_field => { "[destination][ip]" => "%{[netflow][ipv4_dst_addr]}" }
      }
    }

    # Map source/destination ports
    if [netflow][l4_src_port] {
      mutate {
        add_field => { "[source][port]" => "%{[netflow][l4_src_port]}" }
      }
    }
    if [netflow][l4_dst_port] {
      mutate {
        add_field => { "[destination][port]" => "%{[netflow][l4_dst_port]}" }
      }
    }

    # Map protocol number to transport name and set network.transport
    if [netflow][protocol] {
      mutate {
        add_field => { "[@metadata][protocol_num]" => "%{[netflow][protocol]}" }
      }
      translate {
        field => "[@metadata][protocol_num]"
        destination => "[network][transport]"
        dictionary => {
          "1" => "icmp"
          "6" => "tcp"
          "17" => "udp"
          "47" => "gre"
          "50" => "esp"
          "51" => "ah"
          "58" => "icmpv6"
          "89" => "ospf"
          "132" => "sctp"
        }
        fallback => "%{[@metadata][protocol_num]}"
      }
    }

    # Apply Juniper 4096x sampling multiplier and map to ECS network.bytes/packets
    if [netflow][total_bytes] {
      ruby {
        code => "event.set('[flow][bytes]', event.get('[netflow][total_bytes]').to_i * 4096)"
      }
      ruby {
        code => "event.set('[network][bytes]', event.get('[netflow][total_bytes]').to_i * 4096)"
      }
    }
    if [netflow][total_packets] {
      ruby {
        code => "event.set('[flow][packets]', event.get('[netflow][total_packets]').to_i * 4096)"
      }
      ruby {
        code => "event.set('[network][packets]', event.get('[netflow][total_packets]').to_i * 4096)"
      }
    }

    # Also map in_bytes/in_pkts if present (alternative field names)
    if [netflow][in_bytes] {
      ruby {
        code => "event.set('[network][bytes]', event.get('[netflow][in_bytes]').to_i * 4096)"
      }
    }
    if [netflow][in_pkts] {
      ruby {
        code => "event.set('[network][packets]', event.get('[netflow][in_pkts]').to_i * 4096)"
      }
    }

    # Set network.direction if available
    if [netflow][direction] {
      mutate {
        add_field => { "[network][direction]" => "%{[netflow][direction]}" }
      }
    }
  }

  if [type] == "sflow" {
    # sFlow: use agent_ip which is the switch IP
    if [agent_ip] {
      mutate {
        add_field => { "[device][name]" => "%{[agent_ip]}" }
      }
    } else {
      mutate {
        add_field => { "[device][name]" => "%{[@metadata][src_ip]}" }
      }
    }
    mutate {
      add_field => { "flow_source" => "sflow" }
    }

    # sFlow ECS mappings
    if [src_ip] {
      mutate {
        add_field => { "[source][ip]" => "%{[src_ip]}" }
      }
    }
    if [dst_ip] {
      mutate {
        add_field => { "[destination][ip]" => "%{[dst_ip]}" }
      }
    }
    if [src_port] {
      mutate {
        add_field => { "[source][port]" => "%{[src_port]}" }
      }
    }
    if [dst_port] {
      mutate {
        add_field => { "[destination][port]" => "%{[dst_port]}" }
      }
    }
    if [ip_protocol] {
      translate {
        field => "[ip_protocol]"
        destination => "[network][transport]"
        dictionary => {
          "1" => "icmp"
          "6" => "tcp"
          "17" => "udp"
          "47" => "gre"
          "50" => "esp"
          "51" => "ah"
          "58" => "icmpv6"
          "89" => "ospf"
          "132" => "sctp"
        }
        fallback => "%{[ip_protocol]}"
      }
    }

    # Apply sampling multiplier
    if [frame_length] and [sampling_rate] {
      ruby {
        code => "event.set('[flow][bytes]', event.get('frame_length').to_i * event.get('sampling_rate').to_i)"
      }
      ruby {
        code => "event.set('[network][bytes]', event.get('frame_length').to_i * event.get('sampling_rate').to_i)"
      }
    }
  }
}

output {
  elasticsearch {
    hosts => ["es-remote:9200"]
    index => "logstash-flow-%{+YYYY.MM.dd}"
    ssl_enabled => true
    ssl_verification_mode => "none"
    user => "elastic"
    password => "telehouse"
  }
}
