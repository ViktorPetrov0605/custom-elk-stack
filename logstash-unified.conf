input {
  udp {
    port => 2050
    type => "netflow"
    codec => netflow {
      versions => [5, 9]
    }
  }
  udp {
    port => 6343
    type => "sflow"
    codec => sflow { }
  }
}

filter {
  # Capture the packet source IP from Logstash (UDP sender)
  mutate {
    add_field => { "[@metadata][src_ip]" => "%{[host][ip]}" }
  }
  
  if [type] == "netflow" {
    # Try to get NetFlow exporter IP, fallback to packet source
    if [netflow][exporter][ipv4_address] {
      mutate {
        add_field => { "[device][name]" => "%{[netflow][exporter][ipv4_address]}" }
      }
    } else if [netflow][ipv4_src_addr] {
      mutate {
        add_field => { "[device][name]" => "%{[netflow][ipv4_src_addr]}" }
      }
    } else if [ipfix][exporter][ipv4_address] {
      mutate {
        add_field => { "[device][name]" => "%{[ipfix][exporter][ipv4_address]}" }
      }
    } else {
      # Fallback to packet source IP from metadata
      mutate {
        add_field => { "[device][name]" => "%{[@metadata][src_ip]}" }
      }
    }
    mutate {
      add_field => { "flow_source" => "netflow" }
    }
    
    # Apply Juniper 4096x sampling multiplier
    if [netflow][total_bytes] {
      ruby {
        code => "event.set('[flow][bytes]', event.get('[netflow][total_bytes]').to_i * 4096)"
      }
    }
    if [netflow][total_packets] {
      ruby {
        code => "event.set('[flow][packets]', event.get('[netflow][total_packets]').to_i * 4096)"
      }
    }
  }
  
  if [type] == "sflow" {
    # sFlow: use agent_ip which is the switch IP
    if [agent_ip] {
      mutate {
        add_field => { "[device][name]" => "%{[agent_ip]}" }
      }
    } else {
      mutate {
        add_field => { "[device][name]" => "%{[@metadata][src_ip]}" }
      }
    }
    mutate {
      add_field => { "flow_source" => "sflow" }
    }
    
    # Apply sampling multiplier
    if [frame_length] and [sampling_rate] {
      ruby {
        code => "event.set('[flow][bytes]', event.get('frame_length').to_i * event.get('sampling_rate').to_i)"
      }
    }
  }
}

output {
  elasticsearch {
    hosts => ["es-remote:9200"]
    ilm_enabled => true
    ilm_rollover_alias => "logstash-flow"
    ilm_policy => "logstash-flow-policy"
    ssl => true
    ssl_certificate_verification => false
    user => "elastic"
    password => "telehouse"
  }
}
