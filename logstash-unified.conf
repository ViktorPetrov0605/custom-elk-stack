# Logstash Pipeline - Unified Flow Collection
# Supports: NetFlow (Juniper) on port 2050
# Edit this file per backend node to match your device configuration

input {
  # NetFlow from Juniper switches
  udp {
    port => 2050
    type => "netflow"
    codec => netflow
    receive_buffer_bytes => 16777216
    workers => 8
  }

  # Optional: sFlow from Cisco Nexus (uncomment if needed)
  # udp {
  #   port => 6343
  #   type => "sflow"
  #   codec => sflow
  #   receive_buffer_bytes => 16777216
  #   workers => 4
  # }
}

filter {
  # ============================================
  # NetFlow Processing (Juniper)
  # ============================================
  if [type] == "netflow" {
    mutate {
      add_field => {
        "[event][type]" => "netflow"
        "[device][name]" => "juniper-sw"
        "[device][ip]" => "10.4.4.93"
        "[agent][name]" => "logstash-collector"
        "[agent][type]" => "logstash"
      }
    }

    # Rename to unified ECS schema
    mutate {
      rename => {
        "[netflow][ipv4_src_addr]" => "[source][ip]"
        "[netflow][ipv4_dst_addr]" => "[destination][ip]"
        "[netflow][l4_src_port]"   => "[source][port]"
        "[netflow][l4_dst_port]"   => "[destination][port]"
        "[netflow][protocol]"      => "[network][iana_number]"
        "[netflow][input_snmp]"    => "[observer][ingress][interface][id]"
        "[netflow][output_snmp]"   => "[observer][egress][interface][id]"
      }
    }

    # AS Numbers (if available in NetFlow v9)
    if [netflow][src_as] {
      mutate { copy => { "[netflow][src_as]" => "[source][as][number]" } }
    }
    if [netflow][dst_as] {
      mutate { copy => { "[netflow][dst_as]" => "[destination][as][number]" } }
    }

    # Flow direction
    if [observer][ingress][interface][id] and [observer][egress][interface][id] {
      mutate { add_field => { "[network][direction]" => "inbound" } }
    } else {
      mutate { add_field => { "[network][direction]" => "unknown" } }
    }

    # CRITICAL: Apply 4096x sampling multiplier for Juniper
    ruby {
      code => "
        flow_bytes = event.get('[netflow][in_bytes]').to_i
        flow_packets = event.get('[netflow][in_pkts]').to_i
        actual_bytes = flow_bytes * 4096
        actual_packets = flow_packets * 4096
        event.set('[network][bytes]', actual_bytes)
        event.set('[network][packets]', actual_packets)
        event.set('[source][bytes]', actual_bytes)
        event.set('[source][packets]', actual_packets)
      "
    }

    # Sampling metadata
    mutate {
      add_field => {
        "[sampling][rate]" => 4096
        "[sampling][algorithm]" => 1
      }
    }

    # Flow label (correlation ID)
    ruby {
      code => "
        src = event.get('[source][ip]') || ''
        dst = event.get('[destination][ip]') || ''
        sport = event.get('[source][port]').to_s || '0'
        dport = event.get('[destination][port]').to_s || '0'
        proto = event.get('[network][iana_number]').to_s || '0'
        flow_label = [src, dst, sport, dport, proto].join('-')
        event.set('[flow][id]', flow_label)
      "
    }
  }

  # ============================================
  # sFlow Processing (Cisco Nexus) - Uncomment if using sFlow
  # ============================================
  # else if [type] == "sflow" {
  #   mutate {
  #     add_field => {
  #       "[event][type]" => "sflow"
  #       "[device][name]" => "cisco-nexus"
  #       "[agent][name]" => "logstash-collector"
  #       "[agent][type]" => "logstash"
  #     }
  #   }
  #
  #   if [sflow][agent_ip] {
  #     mutate { copy => { "[sflow][agent_ip]" => "[host][ip]" } }
  #   }
  #
  #   # Map sFlow fields to ECS
  #   if [sflow][ipv4_src_addr] { mutate { copy => { "[sflow][ipv4_src_addr]" => "[source][ip]" } } }
  #   if [sflow][ipv4_dst_addr] { mutate { copy => { "[sflow][ipv4_dst_addr]" => "[destination][ip]" } } }
  #   if [sflow][l4_src_port] { mutate { copy => { "[sflow][l4_src_port]" => "[source][port]" } } }
  #   if [sflow][l4_dst_port] { mutate { copy => { "[sflow][l4_dst_port]" => "[destination][port]" } } }
  #   if [sflow][protocol] { mutate { copy => { "[sflow][protocol]" => "[network][iana_number]" } } }
  # }

  # ============================================
  # Common Processing
  # ============================================

  # Type conversions
  mutate {
    convert => {
      "[network][iana_number]" => "integer"
      "[source][port]"         => "integer"
      "[destination][port]"    => "integer"
      "[source][as][number]"   => "integer"
      "[destination][as][number]" => "integer"
    }
  }

  # Protocol name resolution
  if [network][iana_number] == 6 {
    mutate { add_field => { "[network][transport]" => "tcp" "[network][protocol]" => "tcp" } }
  } else if [network][iana_number] == 17 {
    mutate { add_field => { "[network][transport]" => "udp" "[network][protocol]" => "udp" } }
  } else if [network][iana_number] == 1 {
    mutate { add_field => { "[network][transport]" => "icmp" "[network][protocol]" => "icmp" } }
  }

  # Convert iana_number to string after protocol resolution
  mutate { convert => { "[network][iana_number]" => "string" } }

  # Clean up nested original data
  mutate { remove_field => [ "[netflow]", "[sflow]" ] }
}

output {
  # Send to LOCAL Elasticsearch on this backend node
  elasticsearch {
    hosts => ["https://es-remote:9200"]
    user => "elastic"
    password => "${ELASTIC_PASSWORD}"
    ssl_enabled => true
    ssl_verification_mode => "none"
    index => "logstash-flow-%{+YYYY.MM.dd}"
  }
}