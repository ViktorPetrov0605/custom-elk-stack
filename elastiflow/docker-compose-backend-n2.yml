version: '3.8'

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.2.4
    container_name: es-data-n2
    restart: unless-stopped
    environment:
      - node.name=es-data-n2
      - cluster.name=elastiflow-cluster
      - node.roles=data,ingest
      - discovery.seed_hosts=10.4.4.87
      - cluster.initial_master_nodes=es-master
      - ELASTIC_PASSWORD=elastic123
      - xpack.security.enabled=false
      - bootstrap.memory_lock=true
      - "ES_JAVA_OPTS=-Xms2g -Xmx2g"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - es-data-n2:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
      - "9300:9300"
    networks:
      - elastiflow-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200/_cluster/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  elastiflow-collector:
    image: elastiflow/unified-collector:latest
    container_name: elastiflow-collector-sflow
    restart: unless-stopped
    environment:
      # License
      - EF_LICENSE_KEY=free
      # Logging
      - EF_LOGGER_LEVEL=info
      # sFlow settings
      - EF_SFLOW_PORT=6343
      - EF_SFLOW_IP=0.0.0.0
      # Output to Elasticsearch
      - EF_OUTPUT_ELASTICSEARCH_ENABLE=true
      - EF_OUTPUT_ELASTICSEARCH_HOST=elasticsearch:9200
      - EF_OUTPUT_ELASTICSEARCH_INDEX=elastiflow
      - EF_OUTPUT_ELASTICSEARCH_TEMPLATE_ENABLED=true
      # GeoIP (optional - will work without)
      - EF_GEOIP_ENABLE=true
      - EF_GEOIP_CITY_PATH=/usr/share/GeoIP/GeoLite2-City.mmdb
      - EF_GEOIP_ASN_PATH=/usr/share/GeoIP/GeoLite2-ASN.mmdb
    ports:
      - "6343:6343/udp"
    networks:
      - elastiflow-net
    depends_on:
      elasticsearch:
        condition: service_healthy
    # Give it enough time for ES to be ready
    command: ["/bin/sh", "-c", "sleep 30 && /usr/local/bin/elastiflow"]

volumes:
  es-data-n2:
    driver: local

networks:
  elastiflow-net:
    driver: bridge
