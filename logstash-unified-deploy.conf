input {
  udp {
    port => 2050
    type => "netflow"
    codec => netflow
    receive_buffer_bytes => 16777216
    workers => 4
  }
  udp {
    port => 6343
    type => "sflow"
    codec => sflow
    receive_buffer_bytes => 16777216
    workers => 4
  }
}

filter {
  mutate {
    add_field => {
      "[agent][name]" => "logstash-collector"
      "[agent][type]" => "logstash"
    }
  }

  if [type] == "netflow" {
    # NetFlow (Juniper) specific logic
    mutate {
      add_field => {
        "[event][type]" => "netflow"
        "[device][name]" => "juniper-sw"
        "[device][ip]"   => "10.4.4.93"
      }
      rename => {
        "[netflow][ipv4_src_addr]" => "[source][ip]"
        "[netflow][ipv4_dst_addr]" => "[destination][ip]"
        "[netflow][l4_src_port]"   => "[source][port]"
        "[netflow][l4_dst_port]"   => "[destination][port]"
        "[netflow][protocol]"      => "[network][iana_number]"
        "[netflow][input_snmp]"    => "[observer][ingress][interface][id]"
        "[netflow][output_snmp]"   => "[observer][egress][interface][id]"
      }
    }
    
    # Apply Juniper 4096x sampling multiplier
    # Netflow v9 usually uses in_bytes and in_pkts
    ruby {
      code => "
        fb = event.get('[netflow][in_bytes]').to_i
        fp = event.get('[netflow][in_pkts]').to_i
        # Generic flow fields for unified dashboards
        event.set('[network][bytes]', fb * 4096)
        event.set('[network][packets]', fp * 4096)
        # Specific source fields used by some visualizations
        event.set('[source][bytes]', fb * 4096)
        event.set('[source][packets]', fp * 4096)
      "
    }
    # Clean up raw netflow fields once processed
    mutate { remove_field => [ "netflow" ] }

  } else if [type] == "sflow" {
    # sFlow (Cisco Nexus) specific logic
    mutate {
      add_field => {
        "[event][type]" => "sflow"
        # We assume sFlow agent_ip (10.4.4.3 or 10.4.4.4) is correctly set by codec
        # We will label based on agent_ip in device.name if static rename isn't preferred
      }
    }
    if [agent_ip] { 
      mutate { 
        copy => { "agent_ip" => "[device][ip]" }
        copy => { "agent_ip" => "[device][name]" }
      } 
    }
    if [src_ip]   { mutate { copy => { "src_ip"   => "[source][ip]" } } }
    if [dst_ip]   { mutate { copy => { "dst_ip"   => "[destination][ip]" } } }
    if [src_port] { mutate { copy => { "src_port" => "[source][port]" } } }
    if [dst_port] { mutate { copy => { "dst_port" => "[destination][port]" } } }
    if [ip_protocol] { mutate { copy => { "ip_protocol" => "[network][iana_number]" } } }
    
    # sFlow sampling is handled by codec providing frame_length_times_sampling_rate
    ruby {
      code => "
        bytes = event.get('frame_length_times_sampling_rate').to_i
        event.set('[network][bytes]', bytes)
        event.set('[source][bytes]', bytes)
        event.set('[network][packets]', 1) # sFlow is per-packet
        event.set('[source][packets]', 1)
      "
    }
    # Clean up sFlow fields
    mutate { 
      remove_field => [ 
        "sflow", "agent_ip", "src_ip", "dst_ip", "src_port", "dst_port", 
        "ip_protocol", "frame_length", "frame_length_times_sampling_rate",
        "eth_src", "eth_dst", "eth_type", "input_interface_format", 
        "input_interface_value", "output_interface_format", "output_interface_value", 
        "sample_pool", "sampling_rate", "source_id_index", "source_id_type", 
        "sub_agent_id", "uptime_in_ms", "drops", "ip_version", "padded", 
        "protocol", "sflow_type", "stripped", "vlan_id", "vlan_priority" 
      ] 
    }
  }

  # Protocols normalization
  mutate {
    convert => {
      "[network][iana_number]" => "integer"
      "[source][port]"         => "integer"
      "[destination][port]"    => "integer"
    }
  }

  if [network][iana_number] == 6 {
    mutate { add_field => { "[network][transport]" => "tcp" "[network][protocol]" => "tcp" } }
  } else if [network][iana_number] == 17 {
    mutate { add_field => { "[network][transport]" => "udp" "[network][protocol]" => "udp" } }
  } else if [network][iana_number] == 1 {
    mutate { add_field => { "[network][transport]" => "icmp" "[network][protocol]" => "icmp" } }
  }
  mutate { convert => { "[network][iana_number]" => "string" } }
}

output {
  elasticsearch {
    hosts => ["https://es-remote:9200"]
    user => "elastic"
    password => "${ELASTIC_PASSWORD}"
    ssl_enabled => true
    ssl_verification_mode => "none"
    index => "logstash-flow-%{+YYYY.MM.dd}"
  }
}
