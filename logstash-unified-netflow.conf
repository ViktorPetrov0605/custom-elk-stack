# Unified Logstash Configuration for NetFlow (Juniper on Backend N1)
# Location: /home/telehouse/custom-elk-stack/logstash-unified.conf
# Purpose: Normalize NetFlow v9 to unified schema with 4096 sampling multiplier

input {
  udp {
    port => 2050
    type => "netflow"
    codec => netflow {
      versions => [9]
    }
    receive_buffer_bytes => 16777216
    workers => 8
  }
}

filter {
  # Device identification
  mutate {
    add_field => {
      "[device][name]" => "juniper-sw"
      "[device][ip]" => "10.4.4.93"
      "[device][type]" => "router"
      "[event][type]" => "netflow"
      "[observer][type]" => "netflow_exporter"
      "[observer][ip]" => "10.4.4.93"
      "[sampling][rate]" => 4096
      "[sampling][algorithm]" => 1
    }
  }

  # NetFlow v9 field mapping to ECS/Unified Schema
  if [netflow] {
    # IP addresses
    if [netflow][ipv4_src_addr] {
      mutate { add_field => { "[source][ip]" => "%{[netflow][ipv4_src_addr]}" } }
    }
    if [netflow][ipv4_dst_addr] {
      mutate { add_field => { "[destination][ip]" => "%{[netflow][ipv4_dst_addr]}" } }
    }
    
    # Ports
    if [netflow][l4_src_port] {
      mutate { add_field => { "[source][port]" => "%{[netflow][l4_src_port]}" } }
    }
    if [netflow][l4_dst_port] {
      mutate { add_field => { "[destination][port]" => "%{[netflow][l4_dst_port]}" } }
    }
    
    # Protocol
    if [netflow][protocol] {
      mutate { add_field => { "[network][iana_number]" => "%{[netflow][protocol]}" } }
      translate {
        field => "[network][iana_number]"
        destination => "[network][transport]"
        dictionary => {
          "6" => "tcp"
          "17" => "udp"
          "1" => "icmp"
          "47" => "gre"
          "50" => "esp"
          "51" => "ah"
        }
        fallback => "other"
      }
    }
    
    # Interfaces
    if [netflow][input_snmp] {
      mutate { add_field => { "[interface][input]" => "%{[netflow][input_snmp]}" } }
    }
    if [netflow][output_snmp] {
      mutate { add_field => { "[interface][output]" => "%{[netflow][output_snmp]}" } }
    }
    
    # AS numbers
    if [netflow][src_as] {
      mutate { add_field => { "[source][as][number]" => "%{[netflow][src_as]}" } }
    }
    if [netflow][dst_as] {
      mutate { add_field => { "[destination][as][number]" => "%{[netflow][dst_as]}" } }
    }
    
    # CRITICAL: Apply sampling multiplier (1/4096)
    # Calculate actual traffic by multiplying by sampling rate
    if [netflow][in_bytes] {
      ruby {
        code => "event.set('[network][bytes]', event.get('[netflow][in_bytes]').to_i * 4096)"
      }
    }
    if [netflow][in_pkts] {
      ruby {
        code => "event.set('[network][packets]', event.get('[netflow][in_pkts]').to_i * 4096)"
      }
    }
    
    # Flow direction based on interfaces
    if [netflow][input_snmp] and [netflow][output_snmp] {
      mutate { add_field => { "[network][direction]" => "unknown" } }
    }
    
    # Flow label/ID
    if [netflow][flow_id] {
      mutate { add_field => { "[flow][id]" => "%{[netflow][flow_id]}" } }
    }
    
    # Timestamp from flow start
    if [netflow][flow_start] {
      date {
        match => [ "[netflow][flow_start]", "UNIX_MS" ]
        target => "@timestamp"
      }
    }
    
    # Remove original netflow fields to save space
    mutate {
      remove_field => [ "[netflow]" ]
    }
  }
  
  # Ensure network.bytes and network.packets exist
  if ![network][bytes] {
    mutate { add_field => { "[network][bytes]" => 0 } }
  }
  if ![network][packets] {
    mutate { add_field => { "[network][packets]" => 0 } }
  }
  
  # Convert numeric fields
  mutate {
    convert => {
      "[network][bytes]" => "integer"
      "[network][packets]" => "integer"
      "[source][port]" => "integer"
      "[destination][port]" => "integer"
      "[source][as][number]" => "integer"
      "[destination][as][number]" => "integer"
      "[interface][input]" => "integer"
      "[interface][output]" => "integer"
      "[sampling][rate]" => "integer"
      "[sampling][algorithm]" => "integer"
    }
  }
}

output {
  # Output to LOCAL Elasticsearch on Backend (10.4.4.21)
  elasticsearch {
    hosts => ["https://localhost:9200"]
    index => "unified-flow-%{+YYYY.MM.dd}"
    ssl => true
    ssl_certificate_authorities => "/usr/share/logstash/ca.crt"
    user => "elastic"
    password => "${ELASTIC_PASSWORD}"
    ilm_enabled => true
    ilm_rollover_alias => "unified-flow"
    ilm_pattern => "{now/d}-000001"
    ilm_policy => "flow-data-1-day-retention"
  }
  
  # Optional: Debug output
  # stdout { codec => rubydebug }
}