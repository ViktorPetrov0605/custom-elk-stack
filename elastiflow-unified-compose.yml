# ElastiFlow Unified Flow Collector
# Receives both NetFlow (2050) and sFlow (6343) on single collector
# Outputs to Elasticsearch cluster at 10.4.4.87:9200
# Deployed: 2026-02-12 by Valentin-bot

services:
  flow-collector:
    image: elastiflow/flow-collector:7.21.0
    container_name: flow-collector
    restart: unless-stopped
    network_mode: host
    environment:
      # License
      EF_LICENSE_ACCEPTED: "true"
      
      # Flow Server Configuration - Listen on both ports
      # 2050 = NetFlow from Juniper (10.4.4.93)
      # 6343 = sFlow from Cisco Nexus (10.4.4.3, 10.4.4.4)
      EF_FLOW_SERVER_UDP_IP: "0.0.0.0"
      EF_FLOW_SERVER_UDP_PORT: "2050,6343"
      
      # Enable NetFlow v9 and sFlow v5 decoding
      EF_PROCESSOR_DECODE_NETFLOW9_ENABLE: "true"
      EF_PROCESSOR_DECODE_SFLOW5_ENABLE: "true"
      EF_PROCESSOR_DECODE_SFLOW_FLOWS_ENABLE: "true"
      
      # Enable enrichment
      EF_PROCESSOR_DECODE_ENRICH_IP_LOOKUP_ENABLED: "true"
      EF_PROCESSOR_DECODE_ENRICH_DNS_RESOLVER: "true"
      
      # Elasticsearch Output
      EF_OUTPUT_ELASTICSEARCH_ENABLE: "true"
      EF_OUTPUT_ELASTICSEARCH_ADDRESSES: "10.4.4.87:9200"
      EF_OUTPUT_ELASTICSEARCH_USERNAME: "elastic"
      EF_OUTPUT_ELASTICSEARCH_PASSWORD: "telehouse"
      
      # Index Configuration - Use ECS unified schema
      EF_OUTPUT_ELASTICSEARCH_INDEX_TEMPLATE_ENABLE: "true"
      EF_OUTPUT_ELASTICSEARCH_INDEX_TEMPLATE_SHARDS: 2
      EF_OUTPUT_ELASTICSEARCH_INDEX_TEMPLATE_REPLICAS: 1
      EF_OUTPUT_ELASTICSEARCH_ECS_ENABLE: "true"
      
      # TLS Configuration - skip verification for internal network
      EF_OUTPUT_ELASTICSEARCH_TLS_ENABLE: "true"
      EF_OUTPUT_ELASTICSEARCH_TLS_SKIP_VERIFICATION: "true"
      
      # Performance tuning
      EF_PIPELINE_WORKERS: 2
      EF_PIPELINE_BATCH_SIZE: 1000
    
    volumes:
      # State directory for persistent data
      - elastiflow-data:/var/lib/elastiflow/flowcoll
    
    # Health check
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  elastiflow-data:
    driver: local