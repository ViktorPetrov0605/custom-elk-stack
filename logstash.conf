input {
  # Backend N1 - NetFlow from Juniper
  udp {
    port => 2050
    type => "netflow"
    codec => netflow 
    receive_buffer_bytes => 16777216
    workers => 8
  }
  
  # Backend N1 & N2 - sFlow from Cisco Nexus switches
  udp {
    port => 6343
    type => "sflow"
    receive_buffer_bytes => 16777216
    workers => 4
  }
  
  # Legacy syslog from Cisco Nexus (deprecated - prefer sFlow)
  udp {
    port => 8514
    type => "cisco_nexus"
    receive_buffer_bytes => 16777216
  }
}

filter {
  # NetFlow Processing
  if [type] == "netflow" {
    # Fix Juniper exporter IP - override NAT/source-interface IP with correct management IP
    mutate {
      add_field => {
        "[host][ip]" => "10.4.4.93"
        "[observer][ip]" => "10.4.4.93"
        "[netflow][exporter][address]" => "10.4.4.93"
      }
    }

    mutate {
      rename => {
        "[netflow][ipv4_src_addr]" => "[source][ip]"
        "[netflow][ipv4_dst_addr]" => "[destination][ip]"
        "[netflow][l4_src_port]"   => "[source][port]"
        "[netflow][l4_dst_port]"   => "[destination][port]"
        "[netflow][protocol]"      => "[network][iana_number]"
        "[netflow][in_bytes]"      => "[source][bytes]"
        "[netflow][in_pkts]"       => "[source][packets]"
        "[netflow][src_vlan]"      => "[network][vlan][id]"
        "[netflow][src_tos]"       => "[netflow][ip_class_of_service]"
        "[netflow][input_snmp]"    => "[observer][ingress][interface][id]"
        "[netflow][output_snmp]"   => "[observer][egress][interface][id]"
      }
      add_field => {
        "[agent][name]" => "logstash-backend"
        "[agent][type]" => "logstash"
        "[flow][type]" => "netflow"
      }
    }

    # VLAN Fallback
    if ![network][vlan][id] and [netflow][dot1q_vlan_id] {
      mutate { copy => { "[netflow][dot1q_vlan_id]" => "[network][vlan][id]" } }
    }

    # Type Conversion
    mutate {
      convert => {
        "[network][iana_number]"             => "integer"
        "[netflow][ip_protocol_version]"     => "integer"
        "[netflow][exporter][version]"       => "integer"
        "[netflow][ip_class_of_service]"     => "integer"
        "[network][vlan][id]"                => "integer"
        "[netflow][vlan_id]"                 => "integer"
        "[observer][ingress][interface][id]" => "string"
        "[observer][egress][interface][id]"  => "string"
      }
    }

    mutate {
      copy => {
        "[network][vlan][id]"     => "[netflow][vlan_id]"
        "[netflow][control_bits]" => "[network][tcp][flags]"
      }
    }

    # TCP Flags Processing
    if [network][tcp][flags] {
      ruby {
        code => "
          flags = event.get('[network][tcp][flags]').to_i
          out = []
          out << 'FIN' if flags & 1 > 0
          out << 'SYN' if flags & 2 > 0
          out << 'RST' if flags & 4 > 0
          out << 'PSH' if flags & 8 > 0
          out << 'ACK' if flags & 16 > 0
          out << 'URG' if flags & 32 > 0
          event.set('[netflow][tcp_flags]', out)
        "
      }
    }

    # Scale bytes/packets (Juniper sampling factor 1/4096)
    ruby {
      code => "
        s_b = event.get('[source][bytes]').to_i * 4096
        d_b = event.get('[destination][bytes]').to_i * 4096
        s_p = event.get('[source][packets]').to_i * 4096
        d_p = event.get('[destination][packets]').to_i * 4096
        event.set('[source][bytes]', s_b)
        event.set('[destination][bytes]', d_b)
        event.set('[source][packets]', s_p)
        event.set('[destination][packets]', d_p)
        event.set('[network][bytes]', s_b + d_b)
        event.set('[network][packets]', s_p + d_p)
        v = event.get('[netflow][ip_protocol_version]') || event.get('[netflow][version]')
        version = v.to_i
        if version == 4
          event.set('[network][type]', 'ipv4')
        elsif version == 6
          event.set('[network][type]', 'ipv6')
        end
      "
    }

    # GeoIP Enrichment
    if [source][ip] { geoip { source => "[source][ip]" target => "source" } }
    if [destination][ip] { geoip { source => "[destination][ip]" target => "destination" } }

    # Protocol Translation
    if [network][iana_number] == 6 {
      mutate { add_field => { "[network][transport]" => "tcp" "[network][protocol]" => "tcp" } }
    } else if [network][iana_number] == 17 {
      mutate { add_field => { "[network][transport]" => "udp" "[network][protocol]" => "udp" } }
    }
    
    mutate { convert => { "[network][iana_number]" => "string" } }
  }
  
  # sFlow Processing
  else if [type] == "sflow" {
    # sFlow data structure differs from NetFlow
    # Standard fields from sFlow codec
    mutate {
      add_field => {
        "[agent][name]" => "logstash-backend"
        "[agent][type]" => "logstash"
        "[flow][type]" => "sflow"
      }
    }
    
    # Source/Destination IP mapping (sFlow field names)
    if [sflow][ipv4_src_addr] {
      mutate { copy => { "[sflow][ipv4_src_addr]" => "[source][ip]" } }
    }
    if [sflow][ipv4_dst_addr] {
      mutate { copy => { "[sflow][ipv4_dst_addr]" => "[destination][ip]" } }
    }
    
    # Port mapping
    if [sflow][l4_src_port] {
      mutate { copy => { "[sflow][l4_src_port]" => "[source][port]" } }
    }
    if [sflow][l4_dst_port] {
      mutate { copy => { "[sflow][l4_dst_port]" => "[destination][port]" } }
    }
    
    # Protocol
    if [sflow][protocol] {
      mutate { copy => { "[sflow][protocol]" => "[network][iana_number]" } }
    }
    
    # Bytes/Packets (sFlow is already sampled - factor 1/4096)
    if [sflow][in_bytes] {
      ruby {
        code => "
          # sFlow already has sampled values, apply 4096 scaling factor
          s_b = event.get('[sflow][in_bytes]').to_i * 4096
          s_p = event.get('[sflow][in_pkts]').to_i * 4096
          event.set('[source][bytes]', s_b)
          event.set('[source][packets]', s_p)
          event.set('[network][bytes]', s_b)
          event.set('[network][packets]', s_p)
        "
      }
    }
    
    # Interface information
    if [sflow][if_index_in] {
      mutate { copy => { "[sflow][if_index_in]" => "[observer][ingress][interface][id]" } }
    }
    if [sflow][if_index_out] {
      mutate { copy => { "[sflow][if_index_out]" => "[observer][egress][interface][id]" } }
    }
    
    # Source ID (switch IP)
    if [sflow][agent_ip] {
      mutate { copy => { "[sflow][agent_ip]" => "[observer][ip]" } }
    }
    
    # Type conversions
    mutate {
      convert => {
        "[network][iana_number]"             => "integer"
        "[observer][ingress][interface][id]" => "string"
        "[observer][egress][interface][id]"  => "string"
      }
    }
    
    # Protocol name resolution
    if [network][iana_number] == 6 {
      mutate { add_field => { "[network][transport]" => "tcp" "[network][protocol]" => "tcp" } }
    } else if [network][iana_number] == 17 {
      mutate { add_field => { "[network][transport]" => "udp" "[network][protocol]" => "udp" } }
    }
    
    mutate { convert => { "[network][iana_number]" => "string" } }
  }
}

output {
  if [type] == "cisco_nexus" {
    # Legacy syslog (deprecated)
    elasticsearch {
      hosts => ["https://es-remote:9200"]
      user => "elastic"
      password => "${ELASTIC_PASSWORD}"
      ssl_enabled => true
      ssl_certificate_authorities => ["/usr/share/logstash/ca.crt"]
      ssl_verification_mode => "none"
      data_stream => "true"
      data_stream_type => "logs"
      data_stream_dataset => "cisco_nexus.nxos"
    }
  } else if [type] == "sflow" {
    # sFlow data from Cisco Nexus switches
    elasticsearch {
      hosts => ["https://es-remote:9200"]
      user => "elastic"
      password => "${ELASTIC_PASSWORD}"
      ssl_enabled => true
      ssl_certificate_authorities => ["/usr/share/logstash/ca.crt"]
      ssl_verification_mode => "none"
      data_stream => "true"
      data_stream_type => "logs"
      data_stream_dataset => "sflow.net"
    }
  } else {
    # NetFlow data from Juniper
    elasticsearch {
      hosts => ["https://es-remote:9200"]
      user => "elastic"
      password => "${ELASTIC_PASSWORD}"
      ssl_enabled => true
      ssl_certificate_authorities => ["/usr/share/logstash/ca.crt"]
      ssl_verification_mode => "none"
      data_stream => "true"
      data_stream_type => "logs"
      data_stream_dataset => "netflow.log"
    }
  }
}
