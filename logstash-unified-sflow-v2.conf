# Unified Logstash Configuration for sFlow (Cisco Nexus) - Multi-Device Support
# Location: /home/telehouse/custom-elk-stack/logstash-unified-sflow.conf
# Purpose: Normalize sFlow v5 to unified schema
#          Supports multiple Cisco Nexus switches per backend

input {
  udp {
    port => 6343
    type => "sflow"
    receive_buffer_bytes => 16777216
    workers => 4
  }
}

filter {
  # Device identification based on source IP (observation point)
  # This allows multiple switches to send to the same backend
  # Device definitions - add more devices to this block:
  if [host] == "10.4.4.3" {
    mutate {
      add_field => {
        "[device][name]" => "cisco-nexus-bix-backend2-1"
        "[device][ip]" => "10.4.4.3"
        "[device][location]" => "bix-backend2"
        "[device][index]" => "1"
        "[device][type]" => "switch"
        "[device][vendor]" => "cisco"
        "[device][model]" => "nexus"
        "[event][type]" => "sflow"
        "[observer][type]" => "sflow_exporter"
        "[sampling][rate]" => 1
        "[sampling][algorithm]" => 0
      }
    }
  }
  # ADD NEW DEVICES HERE - Example for adding cisco-nexus-bix-backend2-2:
  # else if [host] == "10.4.4.X" {
  #   mutate {
  #     add_field => {
  #       "[device][name]" => "cisco-nexus-bix-backend2-2"
  #       "[device][ip]" => "10.4.4.X"
  #       "[device][location]" => "bix-backend2"
  #       "[device][index]" => "2"
  #       "[device][type]" => "switch"
  #       "[device][vendor]" => "cisco"
  #       "[device][model]" => "nexus"
  #       "[event][type]" => "sflow"
  #       "[observer][type]" => "sflow_exporter"
  #       "[sampling][rate]" => 1
  #       "[sampling][algorithm]" => 0
  #     }
  #   }
  # }
  # Fallback for unknown devices:
  else {
    mutate {
      add_field => {
        "[device][name]" => "unknown-sflow-device"
        "[device][ip]" => "%{host}"
        "[device][type]" => "switch"
        "[device][vendor]" => "cisco"
        "[device][model]" => "nexus"
        "[event][type]" => "sflow"
        "[observer][type]" => "sflow_exporter"
        "[sampling][rate]" => 1
        "[sampling][algorithm]" => 0
      }
    }
  }
  
  # Parse sFlow packet (sFlow v5 structure)
  # sFlow input requires custom parsing or codec
  # Basic field extraction from sFlow
  
  if [sflow] {
    # IP addresses from sFlow
    if [sflow][src_ip] {
      mutate { add_field => { "[source][ip]" => "%{[sflow][src_ip]}" } }
    }
    if [sflow][dst_ip] {
      mutate { add_field => { "[destination][ip]" => "%{[sflow][dst_ip]}" } }
    }
    
    # Ports
    if [sflow][src_port] {
      mutate { add_field => { "[source][port]" => "%{[sflow][src_port]}" } }
    }
    if [sflow][dst_port] {
      mutate { add_field => { "[destination][port]" => "%{[sflow][dst_port]}" } }
    }
    
    # Protocol
    if [sflow][protocol] {
      mutate { add_field => { "[network][iana_number]" => "%{[sflow][protocol]}" } }
      translate {
        field => "[network][iana_number]"
        destination => "[network][transport]"
        dictionary => {
          "6" => "tcp"
          "17" => "udp"
          "1" => "icmp"
        }
        fallback => "other"
      }
    }
    
    # Interfaces (sFlow uses input/output interface indices)
    if [sflow][input_ifindex] {
      mutate { add_field => { "[interface][input]" => "%{[sflow][input_ifindex]}" } }
    }
    if [sflow][output_ifindex] {
      mutate { add_field => { "[interface][output]" => "%{[sflow][output_ifindex]}" } }
    }
    
    # AS numbers (if available in sFlow)
    if [sflow][src_as] {
      mutate { add_field => { "[source][as][number]" => "%{[sflow][src_as]}" } }
    }
    if [sflow][dst_as] {
      mutate { add_field => { "[destination][as][number]" => "%{[sflow][dst_as]}" } }
    }
    
    # sFlow typically doesn't sample - counts are actual values
    if [sflow][frame_length] {
      mutate { add_field => { "[network][bytes]" => "%{[sflow][frame_length]}" } }
    } else {
      mutate { add_field => { "[network][bytes]" => 0 } }
    }
    
    mutate { add_field => { "[network][packets]" => 1 } }  # Each sFlow sample = 1 packet
    
    # Remove original sflow fields
    mutate { remove_field => [ "[sflow]" ] }
  }
  
  # Convert numeric fields
  mutate {
    convert => {
      "[network][bytes]" => "integer"
      "[network][packets]" => "integer"
      "[source][port]" => "integer"
      "[destination][port]" => "integer"
      "[interface][input]" => "integer"
      "[interface][output]" => "integer"
      "[sampling][rate]" => "integer"
    }
  }
}

output {
  # Output to LOCAL Elasticsearch on Backend (10.4.4.90)
  elasticsearch {
    hosts => ["https://localhost:9200"]
    index => "unified-flow-%{+YYYY.MM.dd}"
    ssl => true
    ssl_certificate_authorities => "/usr/share/logstash/ca.crt"
    user => "elastic"
    password => "${ELASTIC_PASSWORD}"
    ilm_enabled => true
    ilm_rollover_alias => "unified-flow"
    ilm_pattern => "{now/d}-000001"
    ilm_policy => "flow-data-1-day-retention"
  }
}
