# Universal Logstash Configuration - NetFlow + sFlow on single backend
# Handles both Juniper NetFlow (UDP 2050) and Cisco Nexus sFlow (UDP 6343)
# Output: unified-flow-* index with proper sampling multipliers

input {
  # NetFlow from Juniper Router
  udp {
    port => 2050
    type => "netflow"
    codec => netflow {
      versions => [9]
    }
    receive_buffer_bytes => 16777216
    workers => 8
  }
  
  # sFlow from Cisco Nexus Switches
  udp {
    port => 6343
    type => "sflow"
    receive_buffer_bytes => 16777216
    workers => 4
  }
}

filter {
  # ============================================
  # NETFLOW PROCESSING (Juniper)
  # ============================================
  if [type] == "netflow" {
    # Device identification
    mutate {
      add_field => {
        "[device][name]" => "juniper-sw"
        "[device][ip]" => "%{[host][ip]}"
        "[device][type]" => "router"
        "[event][type]" => "netflow"
        "[observer][type]" => "netflow_exporter"
        "[sampling][rate]" => 4096
        "[sampling][algorithm]" => 1
      }
    }

    # NetFlow v9 field mapping to ECS/Unified Schema
    if [netflow] {
      # IP addresses
      if [netflow][ipv4_src_addr] {
        mutate { add_field => { "[source][ip]" => "%{[netflow][ipv4_src_addr]}" } }
      }
      if [netflow][ipv4_dst_addr] {
        mutate { add_field => { "[destination][ip]" => "%{[netflow][ipv4_dst_addr]}" } }
      }
      
      # Ports
      if [netflow][l4_src_port] {
        mutate { add_field => { "[source][port]" => "%{[netflow][l4_src_port]}" } }
      }
      if [netflow][l4_dst_port] {
        mutate { add_field => { "[destination][port]" => "%{[netflow][l4_dst_port]}" } }
      }
      
      # Protocol
      if [netflow][protocol] {
        mutate { add_field => { "[network][iana_number]" => "%{[netflow][protocol]}" } }
        translate {
          field => "[network][iana_number]"
          destination => "[network][transport]"
          dictionary => {
            "6" => "tcp"
            "17" => "udp"
            "1" => "icmp"
            "47" => "gre"
            "50" => "esp"
            "51" => "ah"
          }
          fallback => "other"
        }
      }
      
      # Interfaces
      if [netflow][input_snmp] {
        mutate { add_field => { "[interface][input]" => "%{[netflow][input_snmp]}" } }
      }
      if [netflow][output_snmp] {
        mutate { add_field => { "[interface][output]" => "%{[netflow][output_snmp]}" } }
      }
      
      # AS numbers
      if [netflow][src_as] {
        mutate { add_field => { "[source][as][number]" => "%{[netflow][src_as]}" } }
      }
      if [netflow][dst_as] {
        mutate { add_field => { "[destination][as][number]" => "%{[netflow][dst_as]}" } }
      }
      
      # CRITICAL: Apply sampling multiplier (1/4096 for Juniper)
      if [netflow][in_bytes] {
        ruby {
          code => "event.set('[network][bytes]', event.get('[netflow][in_bytes]').to_i * 4096)"
        }
      }
      if [netflow][in_pkts] {
        ruby {
          code => "event.set('[network][packets]', event.get('[netflow][in_pkts]').to_i * 4096)"
        }
      }
      
      # Timestamp from flow start
      if [netflow][flow_start] {
        date {
          match => [ "[netflow][flow_start]", "UNIX_MS" ]
          target => "@timestamp"
        }
      }
      
      # Remove original netflow fields
      mutate { remove_field => [ "[netflow]" ] }
    }
  }
  
  # ============================================
  # SFLOW PROCESSING (Cisco Nexus)
  # ============================================
  if [type] == "sflow" {
    # Device identification based on source IP
    if [host][ip] == "10.4.4.3" {
      mutate {
        add_field => {
          "[device][name]" => "cisco-nexus-1"
          "[device][type]" => "switch"
        }
      }
    } else if [host][ip] == "10.4.4.4" {
      mutate {
        add_field => {
          "[device][name]" => "cisco-nexus-2"
          "[device][type]" => "switch"
        }
      }
    } else {
      mutate {
        add_field => {
          "[device][name]" => "cisco-nexus"
          "[device][type]" => "switch"
        }
      }
    }
    
    mutate {
      add_field => {
        "[device][ip]" => "%{[host][ip]}"
        "[event][type]" => "sflow"
        "[observer][type]" => "sflow_exporter"
        "[sampling][rate]" => 1
        "[sampling][algorithm]" => 0
      }
    }
    
    # sFlow packet parsing (sFlow v5)
    if [sflow] {
      # IP addresses
      if [sflow][src_ip] {
        mutate { add_field => { "[source][ip]" => "%{[sflow][src_ip]}" } }
      }
      if [sflow][dst_ip] {
        mutate { add_field => { "[destination][ip]" => "%{[sflow][dst_ip]}" } }
      }
      
      # Ports
      if [sflow][src_port] {
        mutate { add_field => { "[source][port]" => "%{[sflow][src_port]}" } }
      }
      if [sflow][dst_port] {
        mutate { add_field => { "[destination][port]" => "%{[sflow][dst_port]}" } }
      }
      
      # Protocol
      if [sflow][protocol] {
        mutate { add_field => { "[network][iana_number]" => "%{[sflow][protocol]}" } }
        translate {
          field => "[network][iana_number]"
          destination => "[network][transport]"
          dictionary => {
            "6" => "tcp"
            "17" => "udp"
            "1" => "icmp"
          }
          fallback => "other"
        }
      }
      
      # Interfaces
      if [sflow][input_ifindex] {
        mutate { add_field => { "[interface][input]" => "%{[sflow][input_ifindex]}" } }
      }
      if [sflow][output_ifindex] {
        mutate { add_field => { "[interface][output]" => "%{[sflow][output_ifindex]}" } }
      }
      
      # sFlow counts are actual (not sampled) - sampling happens in switch
      if [sflow][frame_length] {
        mutate { add_field => { "[network][bytes]" => "%{[sflow][frame_length]}" } }
      }
      
      mutate { add_field => { "[network][packets]" => 1 } }
      
      mutate { remove_field => [ "[sflow]" ] }
    }
  }
  
  # ============================================
  # COMMON PROCESSING
  # ============================================
  # Ensure required fields exist
  if ![network][bytes] {
    mutate { add_field => { "[network][bytes]" => 0 } }
  }
  if ![network][packets] {
    mutate { add_field => { "[network][packets]" => 0 } }
  }
  
  # Convert numeric fields
  mutate {
    convert => {
      "[network][bytes]" => "integer"
      "[network][packets]" => "integer"
      "[source][port]" => "integer"
      "[destination][port]" => "integer"
      "[source][as][number]" => "integer"
      "[destination][as][number]" => "integer"
      "[interface][input]" => "integer"
      "[interface][output]" => "integer"
      "[sampling][rate]" => "integer"
      "[sampling][algorithm]" => "integer"
    }
  }
}

output {
  # Output to LOCAL Elasticsearch
  elasticsearch {
    hosts => ["https://localhost:9200"]
    index => "unified-flow-%{+YYYY.MM.dd}"
    ssl => true
    ssl_certificate_authorities => "/usr/share/logstash/ca.crt"
    user => "elastic"
    password => "${ELASTIC_PASSWORD}"
    ilm_enabled => true
    ilm_rollover_alias => "unified-flow"
    ilm_pattern => "{now/d}-000001"
    ilm_policy => "flow-data-1-day-retention"
  }
}
